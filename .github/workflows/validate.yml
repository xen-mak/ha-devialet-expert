name: Validate HACS integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  # hacs/action lists releases through the GitHub API, which needs more
  # than the metadata-only token that an empty permissions block grants.
  contents: read

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate HACS repository
        uses: hacs/action@main
        with:
          category: integration
